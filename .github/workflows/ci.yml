name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: queuepilot_test
          POSTGRES_DB: queuepilot_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queuepilot_test -d queuepilot_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4.11-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      QUEUEPILOT_TEST_DATABASE_URL: postgresql+psycopg://queuepilot_test:ci-test-only@127.0.0.1:5432/queuepilot_test
      QUEUEPILOT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      QUEUEPILOT_ALLOW_TEST_DATABASE: "1"
      QUEUEPILOT_TOKEN_SECRET: ci-test-only-token-secret-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv python install 3.13
      - run: sh scripts/check.sh --require-integration
      - run: python3 scripts/init_env.py
      - run: docker compose --env-file .env.compose --profile test up -d --wait postgres-test redis-test
      - run: env -u QUEUEPILOT_TEST_DATABASE_URL uv run --locked python scripts/rehearse_backup.py --confirm-isolated-test-server
      - run: env -u QUEUEPILOT_TEST_DATABASE_URL uv run --locked python scripts/load_harness.py --confirm-isolated-test-server --seed-count 100 --clients 2 --websockets 2 --duration 5 --api-workers 1
      - if: always()
        run: docker compose --env-file .env.compose --profile test stop postgres-test redis-test
      - run: docker compose --env-file /dev/null config --quiet
        env:
          POSTGRES_PASSWORD: ci-test-only
          QUEUEPILOT_TOKEN_SECRET: ci-test-only-token-secret-at-least-32-bytes
      - run: docker compose --env-file /dev/null up --build --wait api worker
        env:
          POSTGRES_PASSWORD: ci-test-only
          QUEUEPILOT_TOKEN_SECRET: ci-test-only-token-secret-at-least-32-bytes
      - run: |
          curl --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/health/ready
      - if: always()
        run: docker compose --env-file /dev/null down
        env:
          POSTGRES_PASSWORD: ci-test-only
          QUEUEPILOT_TOKEN_SECRET: ci-test-only-token-secret-at-least-32-bytes
